name: ci/cd

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t abclinic-app:${{ github.sha }} .

      - name: Save image
        run: docker save abclinic-app:${{ github.sha }} | gzip > abclinic-app.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: abclinic-app-image
          path: abclinic-app.tar.gz

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: abclinic-app-image

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          if_key_exists: replace

      - name: Deploy to Ubuntu Server
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          scp abclinic-app.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.DEPLOY_PATH }}

          # SSH into the server, load the new image, and swap the running container
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            cd ${{ secrets.DEPLOY_PATH }} && \
            docker load < abclinic-app.tar.gz && \
            rm abclinic-app.tar.gz && \
            mkdir -p /opt/abclinic/data /opt/abclinic/uploads && \
            docker stop abclinic-app || true && \
            docker rm abclinic-app || true && \
            docker run -d \
              --name abclinic-app \
              --restart unless-stopped \
              -p 3000:3000 \
              -e ADMIN_PASSWORD='${ADMIN_PASSWORD}' \
              -v /opt/abclinic/data:/data \
              -v /opt/abclinic/uploads:/app/public/uploads \
              abclinic-app:${{ github.sha }} && \
            docker image prune -f
          "
